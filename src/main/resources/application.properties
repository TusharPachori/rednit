spring.application.name=rednit
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=6000

# Iceberg catalog type (using JDBC for metadata)
iceberg.catalog.name=my_catalog
iceberg.catalog.type=jdbc
iceberg.catalog.jdbc.uri=jdbc:postgresql://localhost:5432/iceberg_db
iceberg.catalog.jdbc.user=postgres
iceberg.catalog.jdbc.password=your_password

# Iceberg warehouse location (MinIO bucket)
iceberg.catalog.warehouse=s3a://iceberg-bucket

# S3 (MinIO) settings
s3.endpoint=http://localhost:9000
s3.access-key=admin
s3.secret-key=admin123
s3.path-style-access=true

